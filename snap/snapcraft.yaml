name: sefarya
base: core24
version: "0.2.0"
summary: Linux desktop client for Sefaria (Talmud & Jewish Library)
description: |
  Sefarya (ספריא) is a fast Linux desktop client for Sefaria focused on Gemara
  and full Jewish library study: side-by-side Rashi and Tosafot, Ein Mishpat,
  Torah Or, Mesorat HaShas, full Sefaria library browsing, offline SQLite cache,
  multi-language UI, and YouTube audio/video lessons.

grade: stable
confinement: strict
license: MIT

apps:
  sefarya:
    command: usr/bin/sefarya
    extensions: [gnome]
    desktop: usr/share/applications/sefarya.desktop
    plugs:
      - network
      - audio-playback
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl

parts:
  sefarya:
    plugin: nil
    source: .
    build-snaps:
      - node/22/stable
      - rustup/latest/stable
    build-packages:
      - pkg-config
      - libssl-dev
      - libwebkit2gtk-4.1-dev
      - libgtk-3-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - patchelf
    stage-packages:
      - libwebkit2gtk-4.1-0
      - yt-dlp
    override-build: |
      rustup default stable
      npm ci
      npx tauri build --bundles deb
      install -Dm755 src-tauri/target/release/sefarya "$CRAFT_PART_INSTALL/usr/bin/sefarya"
      install -Dm644 snap/gui/sefarya.desktop "$CRAFT_PART_INSTALL/usr/share/applications/sefarya.desktop"
      install -Dm644 src-tauri/icons/128x128@2x.png "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/sefarya.png"
